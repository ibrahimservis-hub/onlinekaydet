<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>OnlineKaydet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--nv:#0a1f44;--bl:#1155cc;--bl-l:#e8effb;--or:#f27a1a;--or-d:#dc6a0c;--bg:#f6f7f9;--ink:#273142;--ln:#e6e8ec;--mu:#6b7280;--ok:#0f9d58;--ok-l:#e5f5ec;--er:#c62828;--er-l:#fdeaea;--wa:#b45309;--wa-l:#fef3dc;--r:4px}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
i[data-i]{display:inline-flex;width:17px;height:17px;flex:none}i[data-i] svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--nv);color:#aab6cc;padding:16px 10px;display:flex;flex-direction:column}
.brand{padding:4px 10px 16px}.brand img{width:196px;display:block}.brand small{display:block;font-size:10.5px;font-weight:600;color:#7f8fb0;letter-spacing:.6px;text-transform:uppercase;margin-top:6px}
.g{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#6b7da3;padding:14px 10px 5px;font-weight:700}
.n{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:3px;color:#aab6cc;font-weight:600;border-left:3px solid transparent;cursor:pointer;text-decoration:none}
.n:hover{background:#10285a;color:#fff}.n.on{background:#13306a;color:#fff;border-left-color:var(--or)}
.n b{margin-left:auto;background:#1c3a78;color:#cfe0ff;border-radius:9px;padding:0 7px;font-size:11px}.n b.hot{background:var(--or);color:#fff}
.usr{margin-top:auto;border-top:1px solid #1c3a78;padding:12px 8px 0;display:flex;gap:9px;align-items:center;color:#fff;font-weight:600}.usr span{width:30px;height:30px;border-radius:50%;background:var(--bl);display:grid;place-items:center;font-size:11px}.usr small{display:block;color:#7f8fb0;font-weight:500;font-size:11.5px}
.main{padding:22px 26px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}.hd h1{font-size:21px;letter-spacing:-.3px}.hd p{color:var(--mu);margin-top:2px}.hd .r{display:flex;gap:8px;align-items:center}
.bt{text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid #cfd4dc;border-radius:var(--r);background:#fff;font-weight:600;color:var(--ink);font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit}
.bt:hover{border-color:#aab3c0}.bt.o{background:var(--or);border-color:var(--or-d);color:#fff}.bt.b{background:var(--bl);border-color:var(--bl);color:#fff}.bt.r{color:var(--er);border-color:#efc3c3}.bt.sm{padding:4px 10px;font-size:12px}.bt:disabled{opacity:.5;cursor:default}
.cd{background:#fff;border:1px solid var(--ln);border-radius:var(--r);margin-bottom:14px}.cd>h3{padding:13px 16px 0;font-size:14.5px}.cd>.sub{padding:2px 16px 0;color:var(--mu)}.cd>.bd{padding:12px 16px 14px}
.pl{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pl.ok{background:var(--ok-l);color:#0b7a43}.pl.er{background:var(--er-l);color:var(--er)}.pl.wa{background:var(--wa-l);color:var(--wa)}.pl.bl{background:var(--bl-l);color:var(--bl)}.pl.gy{background:#eef0f3;color:#5b6472}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);padding:9px 14px;border-bottom:1px solid var(--ln);background:#fafbfc}td{padding:10px 14px;border-bottom:1px solid #f0f1f4;vertical-align:middle}tr.cl{cursor:pointer}tr.cl:hover td{background:#f8faff}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}.kp>div{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px}.kp span{display:block;color:var(--mu);font-size:12px}.kp b{font-size:22px;letter-spacing:-.4px}
.fd{margin-bottom:11px}.fd label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.fd small{color:var(--mu)}
.in,input.in,select.in,textarea.in{width:100%;border:1px solid #c9ced6;border-radius:var(--r);padding:8px 10px;background:#fff;min-height:36px;color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 340px;gap:16px}
.tg{display:inline-block;width:34px;height:19px;border-radius:10px;background:#c9cfd9;position:relative;cursor:pointer;vertical-align:middle;flex:none}.tg:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}.tg.on{background:var(--ok)}.tg.on:after{left:17px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #d5d9e0;border-radius:14px;padding:4px 11px;margin:0 6px 6px 0;cursor:pointer;background:#fff;font-weight:600;font-size:12.5px;user-select:none}.chip.on{background:var(--nv);border-color:var(--nv);color:#fff}
.note{padding:10px 12px;border-radius:var(--r);background:var(--bl-l);color:#0b3a8a;margin-bottom:12px}.note.er{background:var(--er-l);color:var(--er)}.note.ok{background:var(--ok-l);color:#0b7a43}
.dt>div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f1f4}.dt span{color:var(--mu)}
.bars>div{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin-bottom:8px}.bars i{display:block;height:10px;background:var(--bl);border-radius:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin-bottom:14px}.tabs a{padding:9px 14px;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;text-decoration:none}.tabs a.on{color:var(--bl);border-color:var(--bl)}
.lgw{min-height:100vh;display:grid;grid-template-columns:minmax(360px,520px) 1fr;background:#1b2433;position:relative;overflow:hidden}
.lgw:after{content:"";position:absolute;top:0;bottom:0;right:0;left:min(520px,40%);background:url(/*LOGINBG*/) 70% center/cover no-repeat}
.lgw:before{content:"";position:absolute;top:0;bottom:0;left:min(520px,40%);width:180px;background:linear-gradient(90deg,#1b2433,#1b243300);z-index:1;pointer-events:none}
.lgc{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:48px clamp(28px,5vw,64px);color:#e8edf5}
.lgc img.lgl{width:190px;margin-bottom:34px}.lgc .kk{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#f2a35c;font-weight:700;margin-bottom:10px}
.lgc h2{font-size:30px;line-height:1.15;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:-.4px}.lgc p.mu{color:#a9b5c9;margin-bottom:26px;font-size:14px}
.lgc .fd label{color:#c7d0df;font-size:12px}.lgc .in{background:#ffffff10;border:1px solid #ffffff2e;color:#fff;min-height:44px;font-size:15px;border-radius:6px}
.lgc .in:focus{outline:2px solid #f27a1a;outline-offset:1px;background:#ffffff18}.lgc .bt{min-height:46px;font-size:15px;margin-top:4px;border-radius:6px}
.lgc .note.er{background:#c6282833;color:#ffb4b4;border:1px solid #c6282866}.lgc .ft{margin-top:34px;font-size:12px;color:#7f8ca3}
@media(max-width:760px){.lgw{grid-template-columns:1fr}.lgw:after{left:0;right:0;bottom:auto;height:260px;background-position:70% top;background-size:auto 260px}.lgw:before{left:0;right:0;width:auto;top:120px;bottom:auto;height:140px;background:linear-gradient(180deg,#1b243300,#1b2433)}.lgc{padding:240px 24px 32px}.lgc img.lgl{margin-bottom:18px;width:160px}.lgc h2{font-size:25px}}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--ln);border-radius:6px;padding:26px}.login img{width:170px;margin-bottom:14px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--nv);color:#fff;padding:11px 16px;border-radius:5px;z-index:9;max-width:380px}.toast.er{background:var(--er)}
.mu{color:var(--mu)}.sm{font-size:12px}.nm{display:flex;gap:10px;align-items:center}.nm .lo{width:32px;height:32px;border-radius:3px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}.nm small{display:block;color:var(--mu);font-size:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:8px}.brand,.g,.usr{display:none}.kp{grid-template-columns:repeat(2,1fr)}.g2,.row2,.row3{grid-template-columns:1fr}}
.tabs{overflow-x:auto;white-space:nowrap}.tabs a{flex:none}
.ownb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--wa-l);border:1px solid #f0d9a8;border-radius:var(--r);padding:8px 12px;margin-bottom:12px;color:#7a4306}.ownb span{flex:1;min-width:200px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tb .in{max-width:280px}.tb .bt:last-child{margin-left:auto}
.in.xs{width:96px;min-height:30px;padding:4px 8px}
.mdl{position:fixed;inset:0;background:#0a1f4466;z-index:20;display:grid;place-items:center;padding:16px}
.mb{background:#fff;border-radius:6px;width:min(520px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 40px #0a1f4455}.mb>h3{padding:14px 18px;border-bottom:1px solid var(--ln);font-size:15px}.mc{padding:14px 18px;overflow:auto}.mf{padding:12px 18px;border-top:1px solid var(--ln);display:flex;justify-content:flex-end;gap:8px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;align-items:start}
.kc{background:#eef0f4;border-radius:var(--r);padding:8px;min-height:160px}.kc>h4{display:flex;justify-content:space-between;padding:4px 6px 8px;font-size:13px}.kc>h4 span{color:var(--mu);font-weight:600}
.kc.ov{outline:2px dashed var(--bl)}
.kd{background:#fff;border:1px solid var(--ln);border-left:3px solid var(--bl);border-radius:3px;padding:9px 10px;margin-bottom:8px;cursor:grab}.kd b{display:block}.kd small{color:var(--mu);display:block}.kd .ac{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.pg{height:8px;background:#e6e8ec;border-radius:4px;overflow:hidden;min-width:90px}.pg i{display:block;height:100%;background:var(--ok)}
.td{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f1f4;text-decoration:none;color:var(--ink)}.td:last-child{border:0}.td b{min-width:30px;text-align:center;background:var(--or);color:#fff;border-radius:10px;padding:0 8px}.td span{flex:1}
.ck{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f4f5f7}.ck.ok{color:#0b7a43}
.cb{width:16px;height:16px}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
</style></head><body><div id="root"></div>
<script>
/*ICONS*/
const LOGO="/*LOGO*/";
const SEC={kombi:"Kombi & Isıtma",klima:"Klima & Soğutma",beyaz_esya:"Beyaz Eşya",elektronik:"Elektronik & TV",bilgisayar:"Bilgisayar & Telefon",tesisat:"Tesisat & Su",elektrik:"Elektrik",guvenlik:"Güvenlik & Kamera"},PKG={baslangic:"Başlangıç",profesyonel:"Profesyonel",tam:"Tam Paket",kurumsal:"Kurumsal"};
const MOD={servis:"Servis",personel:"Personel",muhasebe:"Muhasebe",rapor:"Rapor",sms:"SMS",magaza:"Mağaza",site:"Site",pazarlama:"Pazarlama",bakim:"Bakım ve garanti",teklif:"Teklif",bayi:"Bayi",qr:"QR etiket",atama:"Oto atama",takip:"Canlı takip",odeme:"Ödeme linki",efatura:"E-arşiv",portal:"Portal",arayan:"Arayan no"},SOON={};
let TOKEN=sessionStorage.getItem("ok_t")||"",CACHE={};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ic(){document.querySelectorAll("i[data-i]").forEach(e=>{e.innerHTML='<svg viewBox="0 0 24 24">'+(P[e.dataset.i]||"")+"</svg>"})}
function toast(m,er){const d=document.createElement("div");d.className="toast"+(er?" er":"");d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),er?6000:3200)}
async function api(path,o={}){const r=await fetch("/api"+path,{method:o.method||"GET",headers:Object.assign({"Content-Type":"application/json"},TOKEN?{Authorization:"Bearer "+TOKEN}:{}),body:o.body?JSON.stringify(o.body):undefined});let j=null;try{j=await r.json()}catch(e){}
 if(r.status===401){TOKEN="";sessionStorage.removeItem("ok_t");render()}
 if(!r.ok)throw new Error((j&&j.detail)||("Hata "+r.status));return j}
const fmtD=s=>s?new Date(s).toLocaleDateString("tr-TR"):"—";
const money=n=>(Number(n)||0).toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₺";
const daysLeft=s=>s?Math.ceil((new Date(s)-Date.now())/864e5):null;
function pass(){const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const b=new Uint32Array(12);crypto.getRandomValues(b);b.forEach(x=>s+=a[x%a.length]);return s}

const NAV=[["Genel Bakış","grid","genel"],["g","Satış"],["Satış Hattı","layout","satis"],["Yeni Kurulum","plus","yeni"],["Talepler","chat","talepler"],["g","Firmalar"],["Firmalar","building","firmalar"],["Kurulum Adımları","check","kurulum"],["Toplu İşlemler","bolt","toplu"],["Yetki ve Roller","shield","yetki"],["g","Finans"],["Abonelik & Tahsilat","card","abonelik"],["Paketler & Fiyatlar","box","paketler"],["g","Sistem"],["Alan Adları","globe","alanadlari"],["Kurulum Hazırlığı","globe","hazirlik"],["Sistem Durumu","pulse","sistem"]];
function shell(active,body,title,sub,right){return `<div class="app"><aside class="side"><div class="brand"><img src="${LOGO}" alt="OnlineKaydet"><small>Sahip Paneli</small></div>${NAV.map(n=>n[0]==="g"?`<div class="g">${n[1]}</div>`:`<a class="n${n[2]===active?" on":""}" href="#${n[2]}"><i data-i="${n[1]}"></i>${n[0]}</a>`).join("")}<div class="usr"><span>SK</span><div>Sahip<small>tüm yetkiler</small></div></div><a class="n" style="margin-top:10px" onclick="logout()"><i data-i="arrow"></i>Çıkış</a></aside><main class="main"><div class="hd"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div><div class="r">${right||""}</div></div>${CACHE.tb||""}${body}</main></div>`}
function logout(){TOKEN="";sessionStorage.removeItem("ok_t");render()}
function loginView(){return `<div class="lgw"><div class="lgc"><img class="lgl" src="${LOGO}" alt="OnlineKaydet"><h2>Giriş</h2><p class="mu" style="margin-bottom:22px">E-posta ve şifrenizi girin.</p><form onsubmit="doLogin();return false"><div class="fd"><label for="le">E-posta</label><input id="le" class="in" type="email" autocomplete="username"></div><div class="fd"><label for="lp">Şifre</label><input id="lp" type="password" class="in" autocomplete="current-password"></div><div id="lerr" class="note er" style="display:none"></div><button class="bt o" type="submit" style="width:100%;justify-content:center">Giriş yap</button></form></div></div>`}
async function doLogin(){try{const r=await api("/auth/login",{method:"POST",body:{email:$("#le").value,password:$("#lp").value}});if(!r.user||r.user.role!=="admin")throw new Error("E-posta veya şifre hatalı");TOKEN=r.token;sessionStorage.setItem("ok_t",TOKEN);render()}catch(e){const b=$("#lerr");b.style.display="block";b.textContent=e.message}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&$("#lp"))doLogin()});

/* ---------- Genel bakış ---------- */
async function vGenelBase(){const [o,s]=await Promise.all([api("/admin/overview"),api("/admin/subscriptions?days=14")]);
 const pk=Object.entries(o.packages),mx=Math.max(1,...pk.map(x=>x[1]));
 const rows=[...s.expired.map(f=>[f,"er","Süresi doldu"]),...s.expiring.map(f=>[f,"wa",daysLeft(f.expires_at)+" gün kaldı"])];
 return shell("genel",`<div class="kp"><div><span>Firma</span><b>${o.firms}</b></div><div><span>Aktif</span><b>${o.active}</b></div><div><span>Süresi yaklaşan (14 gün)</span><b>${o.expiring_14d}</b></div><div><span>Süresi dolmuş</span><b>${o.expired}</b></div><div><span>Son 30 gün tahsilat</span><b>${money(o.revenue_30d)}</b></div><div><span>Son 30 gün servis kaydı</span><b>${o.jobs_30d}</b></div></div>
 <div class="g2"><div class="cd"><h3>Süresi yaklaşan / dolan firmalar</h3><div class="sub">Hatırlatma SMS'i platformun SMS ayarıyla gider; aynı firmaya 3 günde bir.</div><div class="bd" style="padding:8px 0 0">${rows.length?`<table><tr><th>Firma</th><th>Bitiş</th><th>Durum</th><th></th></tr>${rows.map(([f,c,t])=>`<tr class="cl" onclick="location.hash='#firma/${f.id}'"><td><b>${esc(f.name)}</b></td><td>${fmtD(f.expires_at)}</td><td><span class="pl ${c}">${t}</span></td><td><span class="bt sm">Aç</span></td></tr>`).join("")}</table>`:`<div class="bd mu">Süresi yaklaşan firma yok.</div>`}</div></div>
 <div><div class="cd"><h3>Paket dağılımı</h3><div class="bd bars">${pk.length?pk.map(([k,v])=>`<div><span>${esc(PKG[k]||k)}</span><i style="width:${v/mx*100}%"></i><b>${v}</b></div>`).join(""):`<span class="mu">Henüz firma yok</span>`}</div></div><div class="cd"><h3>Sektörler</h3><div class="bd bars">${Object.entries(o.sectors).map(([k,v])=>`<div><span>${esc(k==="-"?"Seçilmemiş":(SEC[k]||k))}</span><i style="width:${v/Math.max(1,o.firms)*100}%"></i><b>${v}</b></div>`).join("")||`<span class="mu">—</span>`}</div></div></div></div>`,"Genel Bakış","Platformun anlık durumu",`<button class="bt" onclick="remind()">Hatırlatma SMS'i gönder</button><a class="bt o" href="#yeni"><i data-i="plus"></i>Yeni kurulum</a>`)}
async function remind(){try{const r=await api("/admin/subscriptions/remind",{method:"POST",body:{days:14}});toast(`${r.sent} firmaya gönderildi, ${r.skipped} atlandı`)}catch(e){toast(e.message,1)}}

/* ---------- Firmalar ---------- */
function modIcons(m){return Object.keys(MOD).map(k=>`<span class="pl ${m&&m.includes(k)?"bl":"gy"}" style="margin-right:3px;opacity:${m&&m.includes(k)?1:.45}">${MOD[k][0]}</span>`).join("")}
function statusPl(f){const d=daysLeft(f.expires_at);if(f.status==="askida")return`<span class="pl er">Askıda</span>`;if(d!==null&&d<0)return`<span class="pl er">Süresi doldu</span>`;if(d!==null&&d<=14)return`<span class="pl wa">${d} gün kaldı</span>`;return`<span class="pl ok">Aktif</span>`}
async function vFirmalar(){const r=await api("/admin/firms");CACHE.firms=r.firms;const q=(CACHE.q||"").toLowerCase();const L=r.firms.filter(f=>!q||(f.name+f.login_email+(f.phone||"")).toLowerCase().includes(q));
 return shell("firmalar",`<div class="cd"><div class="bd" style="padding:10px 14px"><input class="in" style="max-width:320px" placeholder="Firma, e-posta, telefon…" value="${esc(CACHE.q||"")}" oninput="CACHE.q=this.value;render(true)"></div>${L.length?`<table><tr><th>Firma</th><th>Sektör</th><th>Paket</th><th>Modüller</th><th>Bitiş</th><th>Durum</th></tr>${L.map(f=>`<tr class="cl" onclick="location.hash='#firma/${f.id}'"><td><div class="nm"><div class="lo">${esc((f.name||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase())}</div><div><b>${esc(f.name)}</b><small>${esc(f.login_email)}</small></div></div></td><td>${esc(SEC[f.sector]||f.sector||"—")}</td><td><span class="pl bl">${esc(PKG[f.package]||f.package||"—")}</span></td><td>${modIcons(f.modules)}</td><td>${fmtD(f.expires_at)}</td><td>${statusPl(f)}</td></tr>`).join("")}</table>`:`<div class="bd mu">Firma bulunamadı.</div>`}</div>`,"Firmalar",`${r.firms.length} firma`,`<a class="bt o" href="#yeni"><i data-i="plus"></i>Yeni kurulum</a>`)}

/* ---------- Yeni kurulum ---------- */
async function vYeni(){const [sec,pk]=await Promise.all([api("/admin/sectors"),api("/admin/packages")]);CACHE.pass=CACHE.pass||pass();
 return shell("yeni",`<div class="g2"><div><div class="cd"><h3>Firma bilgileri</h3><div class="bd"><div class="row2"><div class="fd"><label>Firma adı *</label><input id="n_name" class="in"></div><div class="fd"><label>Yetkili adı</label><input id="n_contact" class="in"></div></div><div class="row2"><div class="fd"><label>Telefon *</label><input id="n_phone" class="in" placeholder="05xx xxx xx xx"><small>Hoş geldin SMS'i bu numaraya gider; fişte de görünür.</small></div><div class="fd"><label>Vergi no</label><input id="n_tax" class="in"></div></div><div class="fd"><label>Adres</label><input id="n_addr" class="in"></div></div></div>

const FT={};let CT={id:"",tab:""};

async function fapi(id,path,o={},retry){const t=await fses(id);const r=await fetch("/api"+path,{method:o.method||"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:o.body?JSON.stringify(o.body):undefined});let j=null;try{j=await r.json()}catch(e){}
 if(r.status===401&&!retry){await fses(id,1);return fapi(id,path,o,1)}
 if(r.status===403)throw new Error("Bu bölüm firmada kapalı (paket veya modül izni yok)");
 if(!r.ok)throw new Error(j&&typeof j.detail==="string"?j.detail:"Hata "+r.status);return j}

async function vGenel(){const [s,pp,ob,ld]=await Promise.all([api("/admin/subscriptions?days=14").catch(()=>({expired:[],expiring:[]})),api("/admin/pipeline").catch(()=>({cards:[]})),api("/admin/onboarding").catch(()=>({firms:[]})),api("/admin/leads?status=yeni").catch(()=>({leads:[]}))]);
 const old=pp.cards.filter(c=>c.stage==="aday"&&Date.now()-new Date(c.updated_at)>7*864e5).length,kb=pp.cards.filter(c=>c.stage==="kurulum").length,eks=ob.firms.filter(f=>f.status==="aktif"&&f.done<f.total).length;
 const T=[[s.expired.length,"firmanın kullanım süresi doldu","abonelik"],[s.expiring.length,"firmanın süresi 14 gün içinde doluyor","abonelik"],[ld.leads.length,"yeni talep yanıt bekliyor","talepler"],[kb,"aday kuruluma hazır","satis"],[old,"aday 7 gündür dokunulmadı","satis"],[eks,"firmanın kurulumu tamamlanmadı","kurulum"]].filter(x=>x[0]);
 CACHE.tb=`<div class="cd"><h3>Bugün yapılacaklar</h3><div class="bd">${T.length?T.map(x=>`<a class="td" href="#${x[2]}"><b>${x[0]}</b><span>${x[1]}</span><i data-i="arrow"></i></a>`).join(""):'<span class="mu">Bugün için bekleyen iş yok.</span>'}</div></div>`;
 return await vGenelBase()}

let VIEWBUSY=0;
async function render(keep,soft){const root=$("#root");if(!TOKEN){root.innerHTML=loginView();return}
 const h=(location.hash||"#genel").slice(1),[p,a,t]=h.split("/");CACHE.tb="";const V={satis:vSatis,kurulum:vKurulum,toplu:vToplu,yetki:vYetki,genel:vGenel,firmalar:vFirmalar,yeni:vYeni,abonelik:vAbonelik,paketler:vPaketler,talepler:vTalepler,alanadlari:vAlan,hazirlik:vHazirlik,sistem:vSistem}[p];
 try{const html=p==="firma"?await vFirma(a,t):await (V||vGenel)();const sy=window.scrollY;root.innerHTML=html;ic();if(p==="firma")loadTab(a,t);if(p==="yeni"&&CACHE.pre){const c=CACHE.pre;CACHE.pre=null;[["n_name",c.name],["n_phone",c.phone],["n_addr",c.city]].forEach(([i,v])=>{if($("#"+i)&&v)$("#"+i).value=v})}if(keep)window.scrollTo(0,sy)}catch(e){root.innerHTML=shell(p,`<div class="note er">${esc(e.message)}</div>`,"Hata")+"";ic()}}
window.addEventListener("hashchange",()=>render());render();
</script></body></html>
