<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1730">
<title>Yönetim Paneli · OnlineKaydet</title>
<style>
:root{--ink:#0b1730;--ink2:#14244a;--blue:#1155cc;--blue-s:#e8effc;--paper:#f5f4ef;--card:#fff;--line:#e6e3da;--tx:#141a24;--mut:#667085;--ok:#16794a;--ok-s:#e3f4ea;--warn:#a45a06;--warn-s:#fdf1dc;--bad:#b42318;--bad-s:#fde8e5;--r:10px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#c9d3e6;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.rail .logo{padding:4px 8px 18px}.rail .logo img{height:26px;display:block}
.rail a{display:flex;align-items:center;gap:11px;padding:10px;border-radius:8px;color:#c9d3e6;text-decoration:none;font-weight:500;font-size:14.5px;margin-bottom:2px;min-height:40px}
.rail a:hover{background:#14244a}.rail a.on{background:#fff;color:var(--ink);font-weight:650}
.rail a .bd{margin-left:auto;background:#f4b740;color:#3a2700;font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px}
.rail .firm{margin-top:auto;border-top:1px solid #22345c;padding:14px 8px 2px;font-size:12.5px;color:#8fa0c2}
.rail .firm b{display:block;color:#fff;font-size:14px;font-weight:600}
.rail .firm button{background:none;border:0;color:#8fa0c2;padding:6px 0 0;text-decoration:underline;font-size:12.5px}
main{padding:26px 32px 40px;min-width:0}
.top{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:25px;font-weight:700;letter-spacing:-.02em}.top p{color:var(--mut);margin-top:2px}.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--tx);white-space:nowrap}
.btn:hover{border-color:#c9c5b8}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:#0e47ad}
.btn.s{min-height:34px;padding:0 11px;font-size:13px}.btn.d{color:var(--bad)}.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card h2{font-size:15px;font-weight:650}
.card .hd{display:flex;align-items:center;gap:10px;padding:15px 18px 10px}.card .hd .sp{flex:1}.card .hd a,.lnk{color:var(--blue);font-weight:600;font-size:13px;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.pad{padding:0 18px 16px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:18px}
.fig{padding:16px 20px;border-left:1px solid var(--line)}.fig:first-child{border-left:0}
.fig small{color:var(--mut);font-size:12.5px;font-weight:500}.fig b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.fig span{font-size:12.5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.row{display:grid;align-items:center;padding:11px 18px;border-top:1px solid var(--line);gap:12px}
.row .t{font-weight:650;font-size:15px}.row .m{color:var(--mut);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.w{background:#eef0f4;color:#475467}.tag.g{background:var(--ok-s);color:var(--ok)}.tag.b{background:var(--blue-s);color:var(--blue)}.tag.y{background:var(--warn-s);color:var(--warn)}.tag.r{background:var(--bad-s);color:var(--bad)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.bar{height:8px;border-radius:8px;background:#eceae3;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.note{font-size:12.5px;color:var(--mut)}.empty{padding:22px 18px;color:var(--mut);text-align:center}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:9px 18px;border-top:1px solid var(--line);background:#faf9f6;white-space:nowrap}
td{padding:11px 18px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}.tw{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.seg button{padding:0 14px;min-height:38px;border:0;background:none;font-weight:600;font-size:13.5px;color:var(--mut)}.seg button.on{background:var(--ink);color:#fff}
/* takvim */
.calw{overflow:auto}
.cal{display:grid;min-width:640px}
.cal .ch{padding:12px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:650;background:#fff;position:sticky;top:0;z-index:3}
.cal .ch small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.cal .hours div{font-size:12px;color:var(--mut);text-align:right;padding:0 8px;transform:translateY(-8px)}.cal .hours div:first-child{transform:none;padding-top:2px}
.cal .col{position:relative;border-left:1px solid var(--line);cursor:pointer}
.cal .col.off{background:repeating-linear-gradient(135deg,#f3f2ee 0 8px,#faf9f6 8px 16px);cursor:default}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:3px 8px;font-size:12.5px;line-height:1.3;overflow:hidden;border-left:3px solid;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;z-index:1}
.ev b{display:block;font-size:13px}
.ev.r{background:var(--bad-s);border-color:var(--bad)}.ev.w{background:#f1f2f5;border-color:#98a2b3}.ev.b{background:var(--blue-s);border-color:var(--blue)}.ev.g{background:var(--ok-s);border-color:var(--ok)}.ev.y{background:var(--warn-s);border-color:#d98a12}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
/* form */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;border:1px solid #d0d5dd;border-radius:8px;padding:9px 11px;min-height:40px;background:#fff;color:var(--tx);font-weight:400;font-size:15px}
label.f>textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.chip{border:1px solid #d0d5dd;background:#fff;border-radius:20px;padding:7px 12px;font-size:13.5px;font-weight:600;min-height:36px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d0d5dd;padding:0}.sw.on{box-shadow:0 0 0 2px var(--ink)}
/* modal */
#ov{position:fixed;inset:0;background:rgba(11,23,48,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.wide{max-width:720px}
.md .mh{display:flex;align-items:center;padding:16px 20px 6px}.md .mh h3{font-size:17px;font-weight:700;flex:1}.md .mh button{border:0;background:none;font-size:24px;line-height:1;color:var(--mut);width:40px;height:40px}
.md .mb{padding:8px 20px 20px}.md .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:8px 0 14px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:80;font-weight:600;max-width:90vw}
#toast.bad{background:var(--bad)}
/* site */
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:0 18px 12px}.ph .it{position:relative;border-radius:10px;overflow:hidden;background:#e9e7df;aspect-ratio:1/1}.ph .it img{width:100%;height:100%;object-fit:cover;display:block}.ph .it button{position:absolute;top:6px;right:6px;min-height:30px;min-width:30px;border-radius:8px;border:0;background:rgba(11,23,48,.8);color:#fff;font-weight:700}.upl{position:relative;overflow:hidden;display:inline-flex}.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}.lgbox{display:flex;align-items:center;gap:16px;padding:0 18px 16px;flex-wrap:wrap}.lgbox .lp{width:120px;height:72px;border:1px dashed #c8ccd4;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}.lgbox .lp img{max-width:100%;max-height:100%;object-fit:contain}.bi{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #eceae2}.bi .th2{width:96px;height:72px;border-radius:8px;background:#e9e7df center/cover}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 18px 18px}
.th{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.th.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-s)}
.th .sv{height:74px;display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-weight:700;font-size:13px}
.th .tb{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}
.tog{width:38px;height:22px;border-radius:22px;background:#d0d5dd;position:relative;flex:none;border:0;padding:0}.tog:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.tog.on{background:var(--blue)}.tog.on:after{left:18px}
.sitegrid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.pv{position:sticky;top:16px}
.pv iframe{width:100%;height:640px;border:0;background:#fff;display:block}
.mhd,.mbar{display:none}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
#login form{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
#login img{height:30px;display:block;margin:0 auto 22px;background:var(--ink);padding:8px 14px;border-radius:8px;box-sizing:content-box}
#login h1{font-size:19px;margin-bottom:4px;text-align:center}#login p.s{color:var(--mut);text-align:center;margin-bottom:18px}
.err{color:var(--bad);font-weight:600;margin:0 0 10px;font-size:13.5px}
@media(max-width:900px){
 .app{display:block}.rail{display:none}main{padding:16px 14px 100px}
 .top h1{font-size:21px}.figs{grid-template-columns:1fr 1fr}.fig{padding:13px 14px;border-top:1px solid var(--line)}.fig:nth-child(-n+2){border-top:0}.fig:nth-child(3){border-left:0}.fig b{font-size:21px}
 .cols,.sitegrid{grid-template-columns:1fr}.pv{position:static}.pv iframe{height:480px}
 .mhd{display:flex;align-items:center;padding:12px 16px;background:var(--ink)}.mhd img{height:22px}
 .mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 6px 14px;z-index:20}
 .mbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);text-decoration:none;min-height:44px;justify-content:center}.mbar a.on{color:var(--blue)}
 .mbar a.plus span{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px rgba(17,85,204,.35)}
 .g3{grid-template-columns:1fr 1fr}.row{padding:11px 14px}.row.ap{grid-template-columns:48px 1fr!important}.row.ap>:nth-child(n+3){grid-column:2}th,td{padding:10px 12px}
 .md{border-radius:14px}#ov{padding:2vh 8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="login" hidden>
 <form id="lf" autocomplete="on"><img src="/salon/logo.png" alt="OnlineKaydet"><h1>Yönetim Paneli</h1><p class="s">E-posta ve şifrenizle girin</p>

<div id="app" hidden>
<div class="mhd"><img src="/salon/logo.png" alt="OnlineKaydet"></div>
<div class="app">
<aside class="rail"><div class="logo"><img src="/salon/logo.png" alt="OnlineKaydet"></div><nav id="nav"></nav>
 <div class="firm"><b id="fn"></b><span id="fu"></span><br><button id="out">Çıkış yap</button></div></aside>

<svg width="0" height="0" style="position:absolute"><defs>

<script>
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var tl=function(n){return Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺'};
var TOK='',B=null,ROUTE='bugun',CUR={};
var NAV=[['bugun','Bugün','home'],['takvim','Takvim','cal'],['musteri','Müşteriler','users'],['kasa','Kasa','wallet'],['ekip','Ekip','team'],['rapor','Raporlar','chart'],['site','Web Sitem','web'],['ayar','Ayarlar','gear']];
var STG={talep:['Onay bekliyor','y'],bekliyor:['Bekliyor','w'],geldi:['Geldi','b'],islemde:['İşlemde','b'],tamamlandi:['Tamamlandı','g'],gelmedi:['Gelmedi','r'],iptal:['İptal','r']};
var GUN=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
function ld(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function sv(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
async function api(p,o){o=o||{};var h={'Content-Type':'application/json'};if(TOK)h.Authorization='Bearer '+TOK;
 var r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});var j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&p.indexOf('/auth/')!==0){logout(true);throw new Error('Oturum süresi doldu, yeniden girin')}
 if(!r.ok){var m=j.detail;if(Array.isArray(m))m=m.map(function(x){return x.msg}).join(', ');var e=new Error(typeof m==='string'?m:'İşlem yapılamadı ('+r.status+')');e.status=r.status;throw e}return j}
function toast(m,bad){var t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},bad?5000:2600)}
function fail(e){toast(e&&e.message||'Hata',true)}
/* tarih */
function pd(s){var a=s.split('-');return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]))}
function iso(d){return d.toISOString().slice(0,10)}
function add(s,n){var d=pd(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function wd(s){return (pd(s).getUTCDay()+6)%7}
function fd(s,short){return new Intl.DateTimeFormat('tr-TR',short?{day:'numeric',month:'short',timeZone:'UTC'}:{day:'numeric',month:'long',weekday:'long',timeZone:'UTC'}).format(pd(s))}
function rng(k){var t=B.today,d=pd(t),y=d.getUTCFullYear(),m=d.getUTCMonth();
 if(k==='bugun')return[t,t];if(k==='hafta'){var s=add(t,-wd(t));return[s,add(s,6)]}
 if(k==='ay')return[iso(new Date(Date.UTC(y,m,1))),iso(new Date(Date.UTC(y,m+1,0)))];
 if(k==='gecen')return[iso(new Date(Date.UTC(y,m-1,1))),iso(new Date(Date.UTC(y,m,0)))];
 return[iso(new Date(Date.UTC(y,m-2,1))),iso(new Date(Date.UTC(y,m+1,0)))]}
function mn(t){return +t.slice(0,2)*60+ +t.slice(3,5)}
function hm(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function ini(n){return esc((n||'?').trim().split(/\s+/).map(function(x){return x[0]}).slice(0,2).join('').toUpperCase())}
function staffOf(id){return (B.staff||[]).filter(function(s){return s.id===id})[0]}
function actives(){return (B.staff||[]).filter(function(s){return s.active!==false})}
function tag(st,bal){var s=STG[st]||['?','w'];if(st==='tamamlandi'&&bal>0)s=['Ödeme bekliyor','y'];return '<span class="tag '+s[1]+'">'+s[0]+'</span>'}
function seg(items,cur,act){return '<div class="seg">'+items.map(function(i){return '<button data-a="'+act+'" data-v="'+i[0]+'" class="'+(i[0]===cur?'on':'')+'">'+i[1]+'</button>'}).join('')+'</div>'}
function svc(v){return (v.items||[]).map(function(i){return esc(i.name)}).join(' + ')||esc(v.want||'—')}
function mayRetry(fn){return fn().catch(function(e){fail(e)})}
/* modal */
function modal(title,body,wide){var o=$('#ov');o.innerHTML='<div class="md'+(wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="mh"><h3>'+esc(title)+'</h3><button data-a="close" aria-label="Kapat">×</button></div><div class="mb">'+body+'</div></div>';o.hidden=false;var f=$('input:not([type=hidden]),select',o);if(f&&innerWidth>900)f.focus()}
function closeM(){var o=$('#ov');o.hidden=true;o.innerHTML=''}
function ask(msg,yes){return new Promise(function(res){modal('Emin misiniz?','<p style="margin:6px 0 16px">'+esc(msg)+'</p><div class="mf"><button class="btn" data-a="close">Vazgeç</button><button class="btn p" id="askok">'+esc(yes||'Evet')+'</button></div>');$('#askok').onclick=function(){closeM();res(true)};$('#ov').dataset.cancel='1'})}

function readImg(file,max,type){return new Promise(function(res,rej){if(/svg/.test(file.type)){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file);return}
 var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));var x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,.86))};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Bu dosya resim olarak açılamadı'))};im.src=u})}
