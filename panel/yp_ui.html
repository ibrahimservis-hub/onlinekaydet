<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1730">
<title>Yönetim Paneli · OnlineKaydet</title>
<style>
:root{--ink:#0b1730;--ink2:#14244a;--blue:#1155cc;--blue-s:#e8effc;--paper:#f5f4ef;--card:#fff;--line:#e6e3da;--tx:#141a24;--mut:#667085;--ok:#16794a;--ok-s:#e3f4ea;--warn:#a45a06;--warn-s:#fdf1dc;--bad:#b42318;--bad-s:#fde8e5;--r:10px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#c9d3e6;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.rail .logo{padding:4px 8px 18px}.rail .logo img{height:26px;display:block}
.rail a{display:flex;align-items:center;gap:11px;padding:10px;border-radius:8px;color:#c9d3e6;text-decoration:none;font-weight:500;font-size:14.5px;margin-bottom:2px;min-height:40px}
.rail a:hover{background:#14244a}.rail a.on{background:#fff;color:var(--ink);font-weight:650}
.rail a .bd{margin-left:auto;background:#f4b740;color:#3a2700;font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px}
.rail .firm{margin-top:auto;border-top:1px solid #22345c;padding:14px 8px 2px;font-size:12.5px;color:#8fa0c2}
.rail .firm b{display:block;color:#fff;font-size:14px;font-weight:600}
.rail .firm button{background:none;border:0;color:#8fa0c2;padding:6px 0 0;text-decoration:underline;font-size:12.5px}
main{padding:26px 32px 40px;min-width:0}
.top{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:25px;font-weight:700;letter-spacing:-.02em}.top p{color:var(--mut);margin-top:2px}.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--tx);white-space:nowrap}
.btn:hover{border-color:#c9c5b8}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:#0e47ad}
.btn.s{min-height:34px;padding:0 11px;font-size:13px}.btn.d{color:var(--bad)}.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card h2{font-size:15px;font-weight:650}
.card .hd{display:flex;align-items:center;gap:10px;padding:15px 18px 10px}.card .hd .sp{flex:1}.card .hd a,.lnk{color:var(--blue);font-weight:600;font-size:13px;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.pad{padding:0 18px 16px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:18px}
.fig{padding:16px 20px;border-left:1px solid var(--line)}.fig:first-child{border-left:0}
.fig small{color:var(--mut);font-size:12.5px;font-weight:500}.fig b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.fig span{font-size:12.5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.row{display:grid;align-items:center;padding:11px 18px;border-top:1px solid var(--line);gap:12px}
.row .t{font-weight:650;font-size:15px}.row .m{color:var(--mut);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.w{background:#eef0f4;color:#475467}.tag.g{background:var(--ok-s);color:var(--ok)}.tag.b{background:var(--blue-s);color:var(--blue)}.tag.y{background:var(--warn-s);color:var(--warn)}.tag.r{background:var(--bad-s);color:var(--bad)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.bar{height:8px;border-radius:8px;background:#eceae3;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}
.note{font-size:12.5px;color:var(--mut)}.empty{padding:22px 18px;color:var(--mut);text-align:center}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:9px 18px;border-top:1px solid var(--line);background:#faf9f6;white-space:nowrap}
td{padding:11px 18px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}.tw{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.seg button{padding:0 14px;min-height:38px;border:0;background:none;font-weight:600;font-size:13.5px;color:var(--mut)}.seg button.on{background:var(--ink);color:#fff}
/* liste / süzgeç */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.fbar input[type=search],.fbar select,.fbar input[type=date]{border:1px solid #d0d5dd;border-radius:8px;padding:0 11px;min-height:38px;background:#fff;font:inherit;color:var(--tx)}
.fbar input[type=search]{flex:1 1 220px}
.fbar .chips{margin:0}.sumline{padding:10px 18px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.chip small{font-weight:500;opacity:.75;margin-left:3px}
.stt{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:2px 0 14px}.stt div{background:#faf9f6;border:1px solid var(--line);border-radius:9px;padding:8px 11px}.stt small{display:block;color:var(--mut);font-size:12px}.stt b{font-size:16px}
.sug{border:1px solid var(--line);border-radius:8px;margin-top:-8px;margin-bottom:12px;overflow:hidden}.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit;cursor:pointer}.sug button:first-child{border-top:0}.sug button:hover{background:var(--blue-s)}
.steps{display:flex;gap:4px;margin:0 0 14px}.steps i{flex:1;height:5px;border-radius:5px;background:#e4e7ec}.steps i.on{background:var(--blue)}
/* takvim */
.calw{overflow:auto}
.cal{display:grid;min-width:640px}
.cal .ch{padding:12px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-weight:650;background:#fff;position:sticky;top:0;z-index:3}
.cal .ch small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.cal .hours div{font-size:12px;color:var(--mut);text-align:right;padding:0 8px;transform:translateY(-8px)}.cal .hours div:first-child{transform:none;padding-top:2px}
.cal .col{position:relative;border-left:1px solid var(--line);cursor:pointer}
.cal .col.off{background:repeating-linear-gradient(135deg,#f3f2ee 0 8px,#faf9f6 8px 16px);cursor:default}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:3px 8px;font-size:12.5px;line-height:1.3;overflow:hidden;border-left:3px solid;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;z-index:1}
.ev b{display:block;font-size:13px}
.ev.r{background:var(--bad-s);border-color:var(--bad)}.ev.w{background:#f1f2f5;border-color:#98a2b3}.ev.b{background:var(--blue-s);border-color:var(--blue)}.ev.g{background:var(--ok-s);border-color:var(--ok)}.ev.y{background:var(--warn-s);border-color:#d98a12}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
/* form */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;border:1px solid #d0d5dd;border-radius:8px;padding:9px 11px;min-height:40px;background:#fff;color:var(--tx);font-weight:400;font-size:15px}
label.f>textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.chip{border:1px solid #d0d5dd;background:#fff;border-radius:20px;padding:7px 12px;font-size:13.5px;font-weight:600;min-height:36px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d0d5dd;padding:0}.sw.on{box-shadow:0 0 0 2px var(--ink)}
/* modal */
#ov{position:fixed;inset:0;background:rgba(11,23,48,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.wide{max-width:720px}
.md .mh{display:flex;align-items:center;padding:16px 20px 6px}.md .mh h3{font-size:17px;font-weight:700;flex:1}.md .mh button{border:0;background:none;font-size:24px;line-height:1;color:var(--mut);width:40px;height:40px}
.md .mb{padding:8px 20px 20px}.md .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:8px 0 14px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:80;font-weight:600;max-width:90vw}
#toast.bad{background:var(--bad)}
/* e-ticaret: ürün, sipariş, kampanya */
/* açma kapama anahtarı */
.sw2{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw2 input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw2 i{position:absolute;inset:0;border-radius:22px;background:#d0d5dd;transition:background .15s;display:block}
.sw2 i:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw2 input:checked + i{background:var(--blue)}
.sw2 input:checked + i:after{left:18px}
.smsph .bub{max-width:100%}
.md .smsph{margin-top:4px}
.ictab{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.ictab .c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;text-align:left;font:inherit;cursor:pointer}
.ictab .c b{display:block;font-size:13.5px;font-weight:650}
.ictab .c small{display:block;font-size:12px;color:var(--mut);margin-top:3px;line-height:1.4}
.ictab .c .ln3{display:flex;gap:8px;margin-top:9px;font-size:12px;font-weight:600;align-items:center;flex-wrap:wrap}
.ictab .c.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.ictab .c .bek{background:var(--warn-s);color:#8a5a20;border-radius:20px;padding:1px 8px;font-size:11.5px}
.ic{display:grid;gap:9px}
.ic .r4{display:grid;grid-template-columns:24px 1fr auto auto;gap:11px;align-items:center;border:1px solid var(--line);
 border-radius:11px;background:#fff;padding:12px 13px}
.ic .r4.bek2{border-color:#f0dcc4;background:#fffdf8}
.ic .gr2{color:#c6c1b6;cursor:grab;font-size:15px;line-height:1;user-select:none}
.ic b{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis}
.ic .sub2{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.ic .meta2{display:flex;gap:9px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.ic .ac3{display:flex;gap:6px;align-items:center}
.ic .ph2{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#e9e7df}
.bosluk{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut);font-size:13.5px;background:#fff}
.bosluk b{display:block;font-size:15px;color:var(--tx);margin-bottom:5px}
.nrow{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.nlist .n{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 15px;margin-bottom:10px}
.nlist .n .t4{display:flex;align-items:flex-start;gap:11px}
.nlist .n b{display:block;font-size:14px;font-weight:650}
.nlist .n small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.nlist .n .msg{background:#faf9f6;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
 font-size:13px;line-height:1.5;color:#3a4254;margin-top:10px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}
.nlist .n .ft3{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.kan{display:inline-flex;gap:4px}
.kan span{border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:11.5px;font-weight:600;color:var(--mut)}
.kan span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.smsb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut)}
.smsb i{font-style:normal;background:#faf9f6;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--tx)}
.smsb.uni i{background:var(--warn-s);border-color:#f0dcc4;color:#8a5a20}
.sms2{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 15px}
.smsph{border:1px solid var(--line);border-radius:14px;padding:13px;background:#faf9f6}
.bub{background:#fff;border:1px solid var(--line);border-radius:12px;border-bottom-left-radius:4px;
 padding:10px 12px;font-size:13px;line-height:1.5;color:#1f2733}
.frm{font-size:11.5px;color:var(--mut);margin-bottom:6px;font-weight:600}
.tip2{background:var(--warn-s);border:1px solid #f0dcc4;border-radius:10px;padding:10px 12px;font-size:12.5px;
 color:#7a5218;line-height:1.5;margin-top:11px}
.varl{display:flex;gap:6px;flex-wrap:wrap}
.varl .vr{border:1px dashed var(--line);border-radius:7px;padding:4px 9px;font-size:12.5px;color:var(--mut);
 font-family:ui-monospace,Menlo,monospace;background:#fff;cursor:pointer}
.varl .vr:hover{border-style:solid;border-color:var(--blue);color:var(--blue)}
.egrp{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.egrp .c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font:inherit;cursor:pointer}
.egrp .c b{display:block;font-size:14px;font-weight:650}
.egrp .c small{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.egrp .c .ln2{display:flex;gap:10px;margin-top:9px;font-size:12.5px;font-weight:600;align-items:center}
.egrp .c.on{border-color:#bfe0c8;box-shadow:0 0 0 1px #bfe0c8}
.egrp .c.err{border-color:#f0c9c4;box-shadow:0 0 0 1px #f0c9c4}
.egrp .c.sel2{outline:2px solid var(--blue);outline-offset:1px}
.ent{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
.ent .e{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px}
.ent .e .tp3{display:flex;align-items:flex-start;gap:10px}
.ent .e b{display:block;font-size:14px;font-weight:650}
.ent .e small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.45}
.ent .e .ft2{display:flex;align-items:center;gap:9px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.ent .e.on2{border-color:#bfe0c8}
.ent .e.err{border-color:#f0c9c4}
.lg2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:#faf9f6;
 font-weight:800;font-size:13px;color:#475569;border:1px solid var(--line)}
.st2{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;white-space:nowrap}
.st2:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st2.g2{color:var(--ok)}.st2.r2{color:var(--bad)}.st2.w2{color:var(--mut)}.st2.y2{color:var(--warn)}
.enthd{display:flex;align-items:center;gap:11px;padding:0 0 13px;border-bottom:1px solid var(--line);margin-bottom:14px}

.enthd small{font-size:12.5px;color:var(--mut)}
.modsw{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.modsw button{padding:0 13px;height:34px;font:inherit;font-size:13px;font-weight:600;color:var(--mut);background:#fff;border:0;cursor:pointer}

.hlp{background:var(--blue-s);border:1px solid #cfdcf7;border-radius:10px;padding:11px 13px;font-size:13px;color:#33415c;line-height:1.5;margin-bottom:14px}
.errbox{background:var(--bad-s);border:1px solid #f0c9c4;border-radius:10px;padding:11px 13px;font-size:13px;color:#7f2315;line-height:1.5;margin-bottom:14px}

input.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}

 padding:11px 18px;background:var(--ink);color:#fff;border-radius:0 0 var(--r) var(--r);margin:0 -1px -1px}

function kmpVeri(f){var g={},cd={},t=f.dataset.type;
 var n=function(k){return f[k]?+f[k].value||0:0};
 if(t==='x_al_y_ode'){cd.buy=n('buy');cd.pay=n('pay')}
 else if(t==='kademeli'){cd.buy=n('buy');cd.give=n('give');g.y_percent=n('y_percent')}
 else if(t==='kargo'){cd.min_total=n('min_total');g.free_ship=true}
 else if(t==='kupon'){cd.code=(f.code.value||'').toUpperCase();g.percent=n('percent');g.amount=n('amount')}
 else{cd.min_total=n('min_total');g.percent=n('percent');g.amount=n('amount')}
 var list=function(v){return (v||'').split(',').map(function(x){return x.trim()}).filter(Boolean)};
 var cats=list(f.cats.value),brands=list(f.brands.value);
 return {name:f.name.value,type:t,cond:cd,gain:g,
  scope:{all:!cats.length&&!brands.length,cats:cats,brands:brands},
  start:f.start.value,end:f.end.value,exclusive:f.exclusive.checked,
  priority:+f.priority.value||10,limit:{total:+f.total.value||0},on:true}}

var SEL={urun:[],siparis:[]};
function selHas(k,id){return SEL[k].indexOf(id)>-1}
function selTog(k,id,on){var i=SEL[k].indexOf(id);if(on&&i<0)SEL[k].push(id);if(!on&&i>-1)SEL[k].splice(i,1)}
function selClear(k){SEL[k]=[]}
function ckCell(k,id){return '<td class="ck"><input type="checkbox" data-sel="'+k+'" value="'+esc(id)+'"'+(selHas(k,id)?' checked':'')+'></td>'}
function ckHead(k){return '<th class="ck"><input type="checkbox" data-selall="'+k+'"></th>'}
function selDraw(k){
 document.querySelectorAll('[data-sel="'+k+'"]').forEach(function(c){c.checked=selHas(k,c.value);
  var tr=c.closest('tr');if(tr)tr.classList.toggle('sel',c.checked)});
 var all=document.querySelector('[data-selall="'+k+'"]');
 if(all){var boxes=document.querySelectorAll('[data-sel="'+k+'"]');
  all.checked=boxes.length>0&&SEL[k].length>=boxes.length;
  all.indeterminate=SEL[k].length>0&&!all.checked}
 var bar=$('#selbar-'+k);if(bar)bar.outerHTML=selBar(k);else{var el=$('#'+(k==='urun'?'ulist':'slist'));
  if(el&&SEL[k].length)el.insertAdjacentHTML('beforeend',selBar(k))}}
function selBar(k){if(!SEL[k].length)return '<span id="selbar-'+k+'" hidden></span>';
 var n=SEL[k].length;
 if(k==='urun')return '<div class="selbar" id="selbar-urun"><b>'+n+' ürün seçildi</b>'
  +'<button class="btn s" data-a="usel-fiyat">Fiyat güncelle</button>'
  +'<button class="btn s" data-a="usel-indirim">İndirim uygula</button>'
  +'<button class="btn s" data-a="usel-stok">Stok güncelle</button>'
  +'<button class="btn s" data-a="usel-kategori">Kategori / marka</button>'
  +'<button class="btn s" data-a="usel-kanal">Pazaryerine aç / kapat</button>'
  +'<button class="btn s" data-a="usel-durum">Yayına al / gizle</button>'
  +'<button class="btn s" data-a="usel-disa">Excel\'e aktar</button>'
  +'<span class="sp"></span><button class="btn s" data-a="usel-sil">Sil</button>'
  +'<button class="btn s" data-a="sel-bos" data-k="urun">Seçimi bırak</button></div>';
 return '<div class="selbar" id="selbar-siparis"><b>'+n+' sipariş seçildi</b>'
  +'<select id="sbdurum"><option value="">Durumu değiştir…</option>'
  +'<option value="onaylandi">Onayla</option><option value="hazirlaniyor">Hazırlanıyor</option>'
  +'<option value="kargoda">Kargoya ver</option><option value="teslim">Teslim edildi</option>'
  +'<option value="iptal">İptal et</option></select>'
  +'<select id="sbkargo"><option value="">Kargo firmasını değiştir…</option>'
  +(CUR.cargos||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select>'
  +'<button class="btn s" data-a="ssel-kargofis">Kargo fişi yazdır</button>'
  +'<button class="btn s" data-a="ssel-sipfis">Sipariş fişi yazdır</button>'
  +'<button class="btn s" data-a="ssel-odendi">Ödendi işaretle</button>'
  +'<button class="btn s" data-a="ssel-disa">Excel\'e aktar</button>'
  +'<span class="sp"></span><button class="btn s" data-a="sel-bos" data-k="siparis">Seçimi bırak</button></div>'}
function yazdir(html){var w=window.open('','_blank');if(!w)return toast('Yazdırma penceresi engellendi, tarayıcı izni verin',true);
 w.document.open();w.document.write(html);w.document.close()}
function csvIndir(name,csv){var b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b);
 var a2=document.createElement('a');a2.href=u;a2.download=name||'liste.csv';document.body.appendChild(a2);a2.click();
 setTimeout(function(){URL.revokeObjectURL(u);a2.remove()},800)}
async function uBulk(body,msg){var r=await api('/yp/products/bulk',{method:'POST',body:Object.assign({ids:SEL.urun},body)});
 closeM();toast(msg.replace('{n}',r.n));selClear('urun');await V.urun.load()}
async function sBulk(body){var r=await api('/yp/orders/bulk',{method:'POST',body:Object.assign({ids:SEL.siparis},body)});
 closeM();toast(r.msg||'Güncellendi',!!(r.skipped||[]).length);
 if((r.skipped||[]).length)setTimeout(function(){modal('Atlanan siparişler',
  '<p class="note" style="margin:0 0 10px">Bu siparişler kendi akışına uymadığı için değişmedi:</p>'
  +r.skipped.map(function(x){return '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><b class="onum">'+esc(x.no)+'</b><div class="m">'+esc(x.why)+'</div></div>'}).join('')
  +'<div class="mf"><button class="btn p" data-a="close">Tamam</button></div>')},600);
 selClear('siparis');await V.siparis.load()}
document.addEventListener('change',function(ev){var el=ev.target;
 if(el.dataset&&el.dataset.sel){selTog(el.dataset.sel,el.value,el.checked);selDraw(el.dataset.sel)}
 else if(el.dataset&&el.dataset.selall){var k=el.dataset.selall;
  SEL[k]=el.checked?Array.prototype.map.call(document.querySelectorAll('[data-sel="'+k+'"]'),function(c){return c.value}):[];
  selDraw(k)}
 else if(el.id==='sbdurum'&&el.value){var v=el.value;el.value='';
  var go=function(){sBulk({op:'status',status:v}).catch(fail)};
  if(v==='iptal')ask(SEL.siparis.length+' sipariş iptal edilsin mi? Ürünler stoğa geri eklenir.','İptal et').then(go);else go()}
 else if(el.id==='sbkargo'&&el.value){var f=el.value;el.value='';sBulk({op:'cargo',cargo:{firm:f}}).catch(fail)}});
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a==='sel-bos'){selClear(b.dataset.k);(b.dataset.k==='urun'?V.urun.load():V.siparis.load()).catch(fail)}
 /* ürün toplu */
 else if(a==='usel-fiyat')modal(SEL.urun.length+' üründe fiyat güncelle',
  '<form id="ubf" data-op="price"><p class="note" style="margin:0 0 10px">Zam için artı, indirim için eksi yazın. İndirimli fiyat varsa o da aynı oranda değişir.</p>'
  +'<label class="f">Yüzde<input name="percent" type="number" step="0.1" required placeholder="10 veya -15"></label>'
  +'<div class="mf"><button type="button" class="btn" data-a="close">Vazgeç</button><button class="btn p">Uygula</button></div></form>');
 else if(a==='usel-indirim')modal(SEL.urun.length+' ürüne indirim uygula',
  '<form id="ubf" data-op="sale"><p class="note" style="margin:0 0 10px">İndirimli fiyat, satış fiyatından bu oran düşülerek hesaplanır. 0 yazarsanız indirim kalkar.</p>'
  +'<label class="f">İndirim yüzdesi<input name="percent" type="number" min="0" max="95" required value="10"></label>'
  +'<div class="mf"><button type="button" class="btn" data-a="close">Vazgeç</button><button class="btn p">Uygula</button></div></form>');
 else if(a==='usel-stok')modal(SEL.urun.length+' üründe stok güncelle',
  '<form id="ubf" data-op="stock"><div class="g2"><label>Stoğu şu sayıya ayarla<input name="set" type="number" min="0" placeholder="örn. 50"></label>'
  +'<label class="f">ya da ekle / çıkar<input name="add" type="number" placeholder="örn. 10 veya -5"></label></div>'
  +'<p class="note">İkisini birden doldurmayın. Stok değişince açık pazaryerlerine gönderim kuyruğa alınır.</p>'
  +'<div class="mf"><button type="button" class="btn" data-a="close">Vazgeç</button><button class="btn p">Uygula</button></div></form>');
 else if(a==='usel-kategori')modal(SEL.urun.length+' ürünün kategori / markası',
  '<form id="ubf" data-op="cat2"><label>Kategori<input name="cat" list="ucats" placeholder="Boş bırakırsanız değişmez"></label>'
  +'<label class="f">Marka<input name="brand" placeholder="Boş bırakırsanız değişmez"></label>'
  +'<datalist id="ucats">'+((CUR.ucats||[]).map(function(c){return '<option>'+esc(c)+'</option>'}).join(''))+'</datalist>'
  +'<div class="mf"><button type="button" class="btn" data-a="close">Vazgeç</button><button class="btn p">Uygula</button></div></form>');
 else if(a==='usel-kanal')modal(SEL.urun.length+' ürünü pazaryerinde aç / kapat',
  '<form id="ubf" data-op="channel"><label>Kanal<select name="channel">'
  +(CUR.kanallar||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></label>'
  +'<label class="f">İşlem<select name="on"><option value="1">Kanalda satışa aç</option><option value="0">Kanaldan kaldır</option></select></label>'
  +'<div class="mf"><button type="button" class="btn" data-a="close">Vazgeç</button><button class="btn p">Uygula</button></div></form>');
 else if(a==='usel-durum')modal(SEL.urun.length+' ürünün durumu',
  '<form id="ubf" data-op="status"><label>Durum<select name="status"><option value="live">Yayında</option><option value="draft">Taslak (sitede görünmez)</option></select></label>'
  +'<div class="mf"><button type="button" class="btn" data-a="close">Vazgeç</button><button class="btn p">Uygula</button></div></form>');
 else if(a==='usel-sil')ask(SEL.urun.length+' ürün silinsin mi? Bu işlem geri alınamaz.','Sil').then(function(){
  uBulk({op:'delete'},'{n} ürün silindi').catch(fail)});
 else if(a==='usel-disa')api('/yp/products/export',{method:'POST',body:{ids:SEL.urun}}).then(function(r){
  csvIndir(r.name,r.csv);toast(r.n+' ürün Excel dosyasına aktarıldı')}).catch(fail);
 /* sipariş toplu */
 else if(a==='ssel-kargofis'||a==='ssel-sipfis')api('/yp/orders/print',{method:'POST',
  body:{ids:SEL.siparis,kind:a==='ssel-kargofis'?'kargo':'siparis'}}).then(function(r){
   yazdir(r.html);toast(r.n+' fiş yazdırmaya hazır')}).catch(fail);
 else if(a==='ssel-odendi')sBulk({op:'paid',on:true}).catch(fail);
 else if(a==='ssel-disa')api('/yp/orders/export',{method:'POST',body:{ids:SEL.siparis}}).then(function(r){
  csvIndir(r.name,r.csv);toast(r.n+' sipariş Excel dosyasına aktarıldı')}).catch(fail);
});
document.addEventListener('submit',function(ev){var f=ev.target;if(fid(f)!=='ubf')return;ev.preventDefault();
 var op=f.dataset.op;
 if(op==='price'||op==='sale')uBulk({op:op,percent:+f.percent.value||0},'{n} ürün güncellendi').catch(fail);
 else if(op==='stock'){var body={op:'stock'};
  if(f.add.value!=='')body.add=+f.add.value;else if(f.set.value!=='')body.set=+f.set.value;else return toast('Bir değer yazın',true);
  uBulk(body,'{n} üründe stok güncellendi').catch(fail)}
 else if(op==='cat2'){var jobs=[];
  if(f.cat.value)jobs.push({op:'cat',cat:f.cat.value});
  if(f.brand.value)jobs.push({op:'brand',brand:f.brand.value});
  if(!jobs.length)return toast('Kategori veya marka yazın',true);
  (async function(){for(var i=0;i<jobs.length;i++)await api('/yp/products/bulk',{method:'POST',body:Object.assign({ids:SEL.urun},jobs[i])});
   closeM();toast(SEL.urun.length+' ürün güncellendi');selClear('urun');await V.urun.load()})().catch(fail)}
 else if(op==='channel')uBulk({op:'channel',channel:f.channel.value,on:f.on.value==='1'},'{n} üründe kanal güncellendi').catch(fail);
 else if(op==='status')uBulk({op:'status',status:f.status.value},'{n} ürün güncellendi').catch(fail)});

/* ---------------- ENTEGRASYONLAR ---------------- */
var EST={bagli:['Bağlı','g'],hata:['Hata','r'],kurulum:['Denenmedi','y'],yok:['Bağlı değil','w']};
function entKisa(n){return esc(String(n||'?').replace(/[^A-Za-zÇĞİÖŞÜçğıöşü0-9]/g,'').slice(0,2).toUpperCase())}
V.entegrasyon=async function(){var F=CUR.ef=CUR.ef||{q:'',group:'',state:''};
 var r=await api('/yp/integrations');CUR.ents=r.items||[];CUR.egroups=r.groups||[];
 var c=r.counts||{};
 var h=head('Entegrasyonlar','Anahtarlarınızı kendiniz girersiniz · deneme yapılmadan “bağlı” yazmayız, hata sebebiyle görünür',
  '<button class="btn" data-a="ent-kayit">İşlem kaydı</button><button class="btn p" data-a="ent-hepsini-dene">Bağlantıları dene</button>');
 h+='<div class="egrp">'+CUR.egroups.map(function(g){
  var cl=g.hata?'err':(g.bagli?'on':'');
  return '<button class="c '+cl+(F.group===g.id?' sel2':'')+'" data-a="eseg-g" data-v="'+g.id+'">'
   +'<b>'+esc(g.name)+'</b><small>'+esc(g.desc||'')+'</small>'
   +'<div class="ln2"><span class="st2 '+(g.bagli?'g2':'w2')+'">'+(g.bagli?g.bagli+' bağlı':'bağlı yok')+'</span>'
   +(g.hata?'<span class="st2 r2">'+g.hata+' hata</span>':'<span class="note">'+g.n+' hazır</span>')+'</div></button>'}).join('')+'</div>';
 h+='<div class="card"><div class="fbar"><input type="search" id="eq" placeholder="Entegrasyon ara: iyzico, Aras, Paraşüt, Nebim…" value="'+esc(F.q)+'">'
  +'<select id="egrp"><option value="">Tüm türler</option>'+CUR.egroups.map(function(g){
    return '<option value="'+g.id+'"'+(F.group===g.id?' selected':'')+'>'+esc(g.name)+'</option>'}).join('')+'</select></div>'
  +'<div class="fbar chips">'+[['','Hepsi',c.hepsi],['bagli','Bağlı',c.bagli],['hata','Hata',c.hata],['yok','Bağlı değil',c.yok]].map(function(s){
    return '<button class="chip '+(F.state===s[0]?'on':'')+'" data-a="eseg" data-v="'+s[0]+'">'+s[1]+'<small>'+(s[2]||0)+'</small></button>'}).join('')+'</div>'
  +'<div id="elist" class="pad"></div></div>';
 $('#main').innerHTML=h;entCiz()};
function entCiz(){var F=CUR.ef,q=(F.q||'').toLowerCase();
 var rows=(CUR.ents||[]).filter(function(i){
  return (!F.group||i.group===F.group)&&(!F.state||i.state===F.state)
   &&(!q||(i.name+' '+i.desc).toLowerCase().indexOf(q)>-1)});
 var el=$('#elist');if(!el)return;
 if(!rows.length){el.innerHTML='<div class="empty">Bu süzgece uyan entegrasyon yok.</div>';return}
 el.innerHTML='<div class="ent">'+rows.map(function(i){
  var st=EST[i.state]||EST.yok,cl=i.state==='bagli'?'on2':(i.state==='hata'?'err':'');
  var bilgi=i.state==='hata'?i.err:(i.state==='bagli'?((i.mode==='canli'?'Canlı':'Test')+(i.last_ok?' · son işlem '+esc(i.last_ok.slice(5,16).replace('T',' ')):'')):'');
  return '<div class="e '+cl+'"><div class="tp3"><span class="lg2">'+entKisa(i.name)+'</span>'
   +'<div style="flex:1"><b>'+esc(i.name)+'</b><small>'+esc(i.desc||'')+'</small></div></div>'
   +'<div class="ft2"><span class="st2 '+st[1]+'2">'+st[0]+'</span>'
   +'<span class="note" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(bilgi)+'</span>'
   +'<button class="btn s'+(i.state==='yok'?' p':'')+'" data-a="ent-ac" data-id="'+esc(i.id)+'">'
   +(i.state==='yok'?'Bağlan':'Ayarlar')+'</button></div></div>'}).join('')+'</div>'}
function entForm(i){
 var alan=i.fields.map(function(f){
  var v=f.secret?f.value:f.value;
  var inp=f.type==='area'?'<textarea name="'+f.key+'" rows="3">'+esc(v)+'</textarea>'
   :'<input name="'+f.key+'" type="'+(f.type==='number'?'number':'text')+'" value="'+esc(v)+'"'
     +(f.secret?' class="mono" autocomplete="off"':'')+(f.required?'':' placeholder="İsteğe bağlı"')+'>';
  return '<label class="f">'+esc(f.label)+(f.required?'':' <span class="note">(isteğe bağlı)</span>')+inp
   +(f.hint?'<div class="note" style="margin:-8px 0 12px">'+esc(f.hint)+'</div>':'')+'</label>'}).join('');
 var durum=i.state==='hata'?'<div class="errbox"><b>Son deneme başarısız.</b> '+esc(i.err)+'</div>':
  (i.state==='bagli'?'<div class="okbox">Bağlantı çalışıyor'+(i.last_ok?' · son başarılı deneme '+esc(i.last_ok.slice(0,16).replace('T',' ')):'')+'</div>':'');
 return '<form id="entf" data-id="'+esc(i.id)+'">'
  +'<div class="enthd"><span class="lg2">'+entKisa(i.name)+'</span><div style="flex:1"><b>'+esc(i.name)+'</b>'
  +'<small>'+esc(i.desc||'')+'</small></div>'
  +'<span class="modsw"><button type="button" data-a="ent-mod" data-v="test" class="'+(i.mode!=='canli'?'on':'')+'">Test</button>'
  +'<button type="button" data-a="ent-mod" data-v="canli" class="'+(i.mode==='canli'?'on':'')+'">Canlı</button></span>'
  +'<input type="hidden" name="mode" value="'+esc(i.mode||'test')+'"></div>'
  +durum
  +(i.hint?'<div class="hlp"><b>Anahtarı nereden alırım?</b><br>'+esc(i.hint)+'</div>':'')
  +alan
  +'<div class="row" style="padding:12px 0;border-top:1px solid var(--line)"><div class="t">Bu entegrasyonu kullan'
  +'<div class="m">Kapatırsanız çalışmaz, ayarlarınız durur</div></div>'
  +'<label class="sw2"><input type="checkbox" name="on"'+((i.on||i.state==='yok')?' checked':'')+'><i></i></label></div>'
  +'<div class="mf">'+(i.state!=='yok'?'<button type="button" class="btn" data-a="ent-sil" data-id="'+esc(i.id)+'">Bağlantıyı kaldır</button>':'')
  +'<div class="sp"></div>'
  +(i.can_test?'<button type="button" class="btn" data-a="ent-dene" data-id="'+esc(i.id)+'">Bağlantıyı dene</button>':'')
  +'<button class="btn p">Kaydet</button></div></form>'}
async function entAc(id){var r=await api('/yp/integrations/'+id);CUR.ent=r.item;
 var kul=(r.uses||[]).length?'<div class="card" style="margin:14px 0 0"><div class="hd"><h2>Bu entegrasyon nerede kullanılıyor</h2></div>'
  +'<div class="pad">'+r.uses.map(function(u){return '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)">'
   +'<div><b>'+esc(u.name)+'</b><div class="m">'+esc(u.desc)+'</div></div></div>'}).join('')
  +'<div class="note" style="margin-top:8px">Bağlantıyı kapatırsanız bunlar çalışmaz.</div></div></div>':'';
 modal(r.item.name,entForm(r.item)+kul)}
async function entKayit(){var r=await api('/yp/integrations/log/son');
 modal('İşlem kaydı',(r.items||[]).length?'<div class="logwrap">'+r.items.map(function(x){
  var bad=/hata/i.test(x.event);
  return '<div class="logrow"><span class="note">'+esc((x.at||'').slice(0,16).replace('T',' '))+'</span>'
   +'<span><b>'+esc(x.name)+'</b> '+esc(x.event)+(x.note?' — '+esc(x.note):'')+'</span>'
   +'<span class="st2 '+(bad?'r2':'g2')+'">'+(bad?'Hata':'Tamam')+'</span></div>'}).join('')+'</div>'
  :'<div class="empty">Henüz işlem yok.</div>')}

/* ---------------- entegrasyon olayları ---------------- */
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a==='eseg'){CUR.ef.state=b.dataset.v;entCiz()}
 else if(a==='eseg-g'){CUR.ef.group=CUR.ef.group===b.dataset.v?'':b.dataset.v;V.entegrasyon().catch(fail)}
 else if(a==='ent-ac'){entAc(b.dataset.id).catch(fail)}
 else if(a==='ent-kayit'){entKayit().catch(fail)}
 else if(a==='ent-mod'){var f=$('#entf');if(!f)return;
  f.elements.mode.value=b.dataset.v;f.querySelectorAll('.modsw button').forEach(function(x){x.classList.toggle('on',x.dataset.v===b.dataset.v)})}
 else if(a==='ent-dene'){var btn=b;btn.disabled=true;
  api('/yp/integrations/'+b.dataset.id+'/test',{method:'POST'}).then(function(r){
   btn.disabled=false;toast(r.msg,!r.ok);if(r.ok)entAc(b.dataset.id).catch(fail)
   else{var el=$('#entf .errbox')||$('#entf .okbox');
    if(el){el.className='errbox';el.innerHTML='<b>Son deneme başarısız.</b> '+esc(r.err)}
    else $('#entf .enthd').insertAdjacentHTML('afterend','<div class="errbox"><b>Son deneme başarısız.</b> '+esc(r.err)+'</div>')}
  }).catch(function(e){btn.disabled=false;fail(e)})}
 else if(a==='ent-sil'){ask('Bağlantı kaldırılsın mı? Girdiğiniz anahtarlar silinir.','Kaldır').then(function(){
  api('/yp/integrations/'+b.dataset.id,{method:'DELETE'}).then(function(){closeM();toast('Bağlantı kaldırıldı');V.entegrasyon()}).catch(fail)})}
 else if(a==='ent-hepsini-dene'){var hedef=(CUR.ents||[]).filter(function(i){return i.can_test&&i.state!=='yok'});
  if(!hedef.length)return toast('Denenecek bağlı entegrasyon yok',true);
  b.disabled=true;toast(hedef.length+' bağlantı deneniyor…');
  (async function(){var iyi=0,kotu=[];
   for(var i=0;i<hedef.length;i++){try{var r=await api('/yp/integrations/'+hedef[i].id+'/test',{method:'POST'});
    if(r.ok)iyi++;else kotu.push(hedef[i].name+' — '+r.err)}catch(e){kotu.push(hedef[i].name+' — '+e.message)}}
   b.disabled=false;await V.entegrasyon();
   if(kotu.length)modal('Deneme sonucu','<p style="margin:0 0 10px">'+iyi+' bağlantı çalışıyor, '+kotu.length+' tanesinde sorun var:</p>'
    +kotu.map(function(x){return '<div class="errbox" style="margin-bottom:8px">'+esc(x)+'</div>'}).join('')
    +'<div class="mf"><button class="btn p" data-a="close">Tamam</button></div>');
   else toast(iyi+' bağlantının hepsi çalışıyor')})().catch(fail)}

function icVeri(f,t){var d={};
 t.fields.forEach(function(fl){var el=f.elements[fl.key];if(!el)return;
  d[fl.key]=fl.type==='imgs'?el.value.split('\n').map(function(x){return x.trim()}).filter(Boolean):el.value});
 return d}

/* ---------------- içerik olayları ---------------- */
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a==='ic-tur'){CUR.icf.tid=b.dataset.v;CUR.icf.state='';CUR.icf.q='';V.icerik().catch(fail)}
 else if(a==='icseg'){CUR.icf.state=b.dataset.v;V.icerik.load().catch(fail)}
 else if(a==='ic-yeni'){if(!CUR.ict)return;modal(CUR.ict.name+' — yeni kayıt',icForm(CUR.ict))}
 else if(a==='ic-duzen'){var r=(CUR.icrows||[]).filter(function(x){return x.id===b.dataset.id})[0];
  if(r)modal(CUR.ict.name+' — düzenle',icForm(CUR.ict,r))}
 else if(a==='ic-sil'){ask('Kayıt silinsin mi? Bu işlem geri alınamaz.','Sil').then(function(){
  api('/yp/content/'+CUR.ict.id+'/'+b.dataset.id,{method:'DELETE'}).then(function(){
   closeM();toast('Kayıt silindi');V.icerik()}).catch(fail)})}
 else if(a==='ic-karar'){api('/yp/content/'+CUR.ict.id+'/'+b.dataset.id+'/onay',{method:'POST',
   body:{karar:b.dataset.v}}).then(function(){toast(b.dataset.v==='onay'?'Onaylandı, sitede görünecek':'Reddedildi');
   V.icerik()}).catch(fail)}
 else if(a==='ic-site'){location.hash='#site'}
});
document.addEventListener('submit',function(ev){var f=ev.target;if(fid(f)!=='icf')return;ev.preventDefault();
 var t=CUR.ict,id=f.dataset.id,btn=f.querySelector('button.p');btn.disabled=true;
 api('/yp/content/'+t.id+(id?'/'+id:''),{method:id?'PUT':'POST',
  body:{data:icVeri(f,t),on:f.elements.on.checked}})
  .then(function(){closeM();toast(id?'Kayıt güncellendi':'Kayıt eklendi');V.icerik()})
  .catch(function(e){btn.disabled=false;fail(e)})});
(function(){var tm;document.addEventListener('input',function(ev){if(ev.target.id!=='icq')return;
 clearTimeout(tm);var v=ev.target.value;tm=setTimeout(function(){CUR.icf.q=v;V.icerik.load().catch(fail)},260)})})();
/* sürükle bırak sıralama */
(function(){var src=null;
 document.addEventListener('dragstart',function(e){var r=e.target.closest&&e.target.closest('#iclist .r4');
  if(!r)return;src=r;r.style.opacity='.45';e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text','x')}catch(x){}});
 document.addEventListener('dragover',function(e){if(!src)return;var r=e.target.closest&&e.target.closest('#iclist .r4');
  if(!r||r===src)return;e.preventDefault();
  var b=r.getBoundingClientRect(),sonra=e.clientY>b.top+b.height/2;
  r.parentNode.insertBefore(src,sonra?r.nextSibling:r)});
 document.addEventListener('drop',function(e){if(src)e.preventDefault()});
 document.addEventListener('dragend',function(){if(!src)return;src.style.opacity='';src=null;
  var ids=Array.prototype.map.call(document.querySelectorAll('#iclist .r4'),function(x){return x.dataset.id});
  if(!ids.length||!CUR.ict)return;
  api('/yp/content/'+CUR.ict.id+'/sira',{method:'POST',body:{ids:ids}})
   .then(function(){toast('Sıra kaydedildi')}).catch(fail)})})();
